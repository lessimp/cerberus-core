name=PropertiesConfig
property.filename=logs
appenders=console

appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Change level from info to debug
rootLogger.level=debug
rootLogger.appenderRefs=stdout
rootLogger.appenderRef.stdout.ref=STDOUT

# Explicitly target Spring Security for maximum detail
logger.security.name=org.springframework.security
logger.security.level=debug
logger.security.additivity=false
logger.security.appenderRef.stdout.ref=STDOUT
